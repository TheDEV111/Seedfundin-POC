version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: seedfundin_postgres
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seedfundin_api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/marketplace?sslmode=disable"
      JWT_SECRET: "your-supabase-jwt-secret-key"
      ENVIRONMENT: "development"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
